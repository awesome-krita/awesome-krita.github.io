name: Add a plugin, theme or tool
description: Paste a link. The details are filled in for you.
title: "Add: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Give a GitHub repo, a Krita Artists topic, or both. The name, author, description, picture and download link are read from there.
        A pull request is opened for you after you submit. If something is wrong, a comment tells you what to fix.
  - type: input
    id: repo
    attributes:
      label: GitHub repo
      placeholder: https://github.com/owner/name
  - type: input
    id: forum
    attributes:
      label: Krita Artists topic
      placeholder: https://krita-artists.org/t/name/12345
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Plugin, Theme, Brushes, Tool, Resource]
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick all that fit. Plugins, tools and resources use the plain ones. Themes and brushes use the ones marked (theme) or (brushes).
      multiple: true
      options: [Color, Workflow, Layers, Reference, Animation, Export, Effects, Other, Dark (theme), Light (theme), Sketching (brushes), Painting (brushes), Inking (brushes), Texture (brushes), Pixel art (brushes)]
    validations:
      required: true
  - type: dropdown
    id: krita
    attributes:
      label: Tested in Krita
      description: Every version you or the author tried it in. Pick all that apply.
      multiple: true
      options: ["6", "5.3", "5.2", "5.1 or older"]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Tested on
      description: Every system you or the author tried it on. Pick all that apply.
      multiple: true
      options: [Windows, macOS, Linux, Android]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Optional. For example known problems, or what didn't work on a system.
  - type: checkboxes
    id: rules
    attributes:
      label: Before you send
      options:
        - label: The download is free and needs no account.
          required: true
