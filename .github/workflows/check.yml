name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Check entries and their links
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
