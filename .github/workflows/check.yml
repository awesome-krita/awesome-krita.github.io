name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: New entries say where they were tested
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          missing=0
          for f in $(git diff --name-only --diff-filter=A FETCH_HEAD HEAD -- entries/); do
            for key in krita os; do
              if ! grep -q "^$key *=" "$f"; then
                echo "$f: needs \`$key\` (see CONTRIBUTING.md)"
                missing=1
              fi
            done
          done
          exit $missing
      - name: Check entries and their links
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
