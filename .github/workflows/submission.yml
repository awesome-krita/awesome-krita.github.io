name: Submission

# Turns a filled-in "Add" or "Suggest an edit" form into a pull request.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Reports are labelled by their form and reviewed by hand, so they don't run anything.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # to start the Check workflow on the new pull request

jobs:
  pull-request:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'submission') || contains(github.event.issue.labels.*.name, 'edit'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      BODY: ${{ github.event.issue.body }}
      LOGIN: ${{ github.event.issue.user.login }}
      KIND: ${{ contains(github.event.issue.labels.*.name, 'edit') && 'edit' || 'submission' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write the entry
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          if [ "$KIND" = edit ]; then
            script=(scripts/edit.py --issue-body "$RUNNER_TEMP/body.md" --author "$LOGIN")
          else
            script=(scripts/add.py --issue-body "$RUNNER_TEMP/body.md")
          fi
          if ! python3 "${script[@]}" > "$RUNNER_TEMP/out.txt" 2>&1; then
            {
              echo "This could not be done yet:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/out.txt"
              echo '```'
              echo
              echo "Edit this issue to fix it. The check runs again after each edit."
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            exit 1
          fi
          tail -1 "$RUNNER_TEMP/out.txt" > "$RUNNER_TEMP/result.txt"

      - name: Check the whole list
        run: python3 -m unittest discover -s tests && python3 scripts/build.py

      - name: Open or update the pull request
        run: |
          IFS=$'\t' read -r path name author < "$RUNNER_TEMP/result.txt"
          verb=add
          [ "$KIND" = edit ] && verb=update
          branch="$KIND-$NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$path"
          git commit -m "$verb: $name"
          git push --force origin "$branch"
          if ! gh pr view "$branch" > /dev/null 2>&1; then
            gh pr create --head "$branch" --title "$verb: $name" --body "From #$NUMBER. Closes #$NUMBER."
            gh issue comment "$NUMBER" --body "Thanks. This is in a pull request now and will be reviewed by hand."
          fi
          # Pull requests opened here don't start other workflows by themselves, so start the checks.
          gh workflow run check.yml --ref "$branch"
          if [ "$author" = author ]; then
            gh issue edit "$NUMBER" --add-label author
          fi
